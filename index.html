<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>手機看盤登入</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ asset_version('app.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='icons/favicon-16.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#09111d">
</head>
<body class="app-body auth-body" data-page="login">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="eyebrow">RTD Mobile Dashboard</div>
      <h1>手機版即時走勢</h1>
      <p class="muted">
      </p>

      <div class="server-box">
        <div><span>連線目標</span><strong id="selected-server-label">自動輪巡伺服器列表</strong></div>
        <div><span>帳號</span><strong id="login-username-preview">--</strong></div>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          <span>手動 IP（優先，可不填）</span>
          <input
            id="manual-server-input"
            type="text"
            name="manual_server"
            inputmode="url"
            placeholder="{{ manual_placeholder }}"
            autocomplete="off"
          >
        </label>
        <label>
          <span>帳號</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
          <span>密碼</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button id="login-submit-button" type="submit" class="primary-btn">登入手機版看盤</button>
      </form>

      <p id="login-error" class="error-text" hidden></p>

      <button id="show-add-user-button" type="button" class="secondary-btn add-user-entry">新增使用者</button>

      <p id="add-user-status" class="status-text" hidden></p>

      <p class="tiny muted">登入時會自動輪巡伺服器列表內的伺服器（手動 IP 優先），不必挑選。全部連不上時可再按「連線」重試。</p>
    </section>
  </main>

  <!-- 新增使用者彈出視窗：第一步管理者驗證 → 通過後切換到第二步新增帳密 -->
  <div id="add-user-modal" class="modal-overlay add-user-modal" hidden>
    <div class="add-user-sheet">
      <div class="add-user-head">
        <h3 id="add-user-title">管理者驗證</h3>
        <button id="close-add-user-modal" class="secondary-btn icon-btn" type="button" aria-label="關閉">✕</button>
      </div>

      <form id="admin-gate-form" class="auth-form">
        <p class="tiny muted">新增使用者前，需先輸入管理者的帳號與密碼。</p>
        <label>
          <span>管理者帳號</span>
          <input type="text" name="admin_username" autocomplete="off" required>
        </label>
        <label>
          <span>管理者密碼</span>
          <input type="password" name="admin_password" autocomplete="off" required>
        </label>
        <p id="gate-error" class="error-text" hidden></p>
        <button type="submit" class="primary-btn">驗證</button>
      </form>

      <form id="new-user-form" class="auth-form" hidden>
        <p class="tiny muted">管理者驗證成功。請輸入要新增的使用者帳號與密碼。</p>
        <label>
          <span>新使用者帳號</span>
          <input type="text" name="new_username" autocomplete="off" required>
        </label>
        <label>
          <span>新使用者密碼</span>
          <input type="password" name="new_password" autocomplete="new-password" required>
        </label>
        <label>
          <span>再輸入一次密碼</span>
          <input type="password" name="new_password_confirm" autocomplete="new-password" required>
        </label>
        <p id="new-user-error" class="error-text" hidden></p>
        <div class="gate-actions">
          <button type="submit" class="primary-btn">確認新增</button>
          <button type="button" id="back-to-gate-button" class="secondary-btn">上一步</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 伺服器全部連不上時的說明窗：可按「連線」重試或「取消」放棄 -->
  <div id="server-retry-modal" class="modal-overlay add-user-modal" hidden>
    <div class="add-user-sheet">
      <div class="add-user-head">
        <h3>伺服器尚未開啟</h3>
      </div>
      <div id="retry-server-list" class="retry-server-list"></div>
      <p class="tiny muted">
        已自動輪巡伺服器列表 3 次都連不上。請確認電腦端程式已開啟、
        手機與電腦在同一個網路，再按「連線」重新嘗試。
      </p>
      <div class="gate-actions">
        <button id="retry-connect-button" type="button" class="primary-btn">連線</button>
        <button id="retry-cancel-button" type="button" class="secondary-btn">取消</button>
      </div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/service-worker.js");
      });
    }
    (function () {
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");
      const manualInput = document.getElementById("manual-server-input");
      const usernameInput = form.querySelector("input[name='username']");
      const passwordInput = form.querySelector("input[name='password']");
      const selectedServerLabel = document.getElementById("selected-server-label");
      const usernamePreview = document.getElementById("login-username-preview");
      const submitButton = document.getElementById("login-submit-button");
      const serverChoices = {{ server_choices|tojson }};
      const loginStateKey = "rtd-mobile-login-state";
      const LOGIN_ROUNDS = 3;   // 自動輪巡次數（需求：輪巡列表內伺服器 3 次）

      const retryModal = document.getElementById("server-retry-modal");
      const retryListEl = document.getElementById("retry-server-list");
      const retryConnectButton = document.getElementById("retry-connect-button");
      const retryCancelButton = document.getElementById("retry-cancel-button");

      const addUserButton = document.getElementById("show-add-user-button");
      const addStatusEl = document.getElementById("add-user-status");

      function normalizeBaseUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) {
          return "";
        }
        const withScheme = /^https?:\/\//i.test(raw) ? raw : ("http://" + raw);
        try {
          const parsed = new URL(withScheme);
          return parsed.origin.replace(/\/$/, "");
        } catch (_error) {
          return "";
        }
      }

      // 輪巡順序：手動 IP（有填才優先）→ 伺服器列表 → 本機。
      // 列表由 /admin 即時維護，這裡只負責照順序嘗試。
      // 注意：label 一律只放「伺服器名稱」，不可以把網址/IP 拼進去——
      // 輪巡時的「輪巡中：xxx」狀態列、以及全部連不上時的說明窗清單，
      // 都會原樣顯示這個 label，拼了網址等於把手機畫面上直接曝露 IP。
      function buildServerQueue() {
        const queue = [];
        const manual = normalizeBaseUrl(manualInput.value);
        if (manual) {
          queue.push({ label: "手動伺服器", url: manual });
        }
        (serverChoices || []).forEach(function (item) {
          const url = normalizeBaseUrl(item && item.url);
          if (!url) {
            return;
          }
          if (queue.some(function (entry) { return entry.url === url; })) {
            return;
          }
          queue.push({ label: String((item && item.label) || "伺服器"), url: url });
        });
        const currentOrigin = normalizeBaseUrl(window.location.origin);
        if (currentOrigin && !queue.some(function (entry) { return entry.url === currentOrigin; })) {
          queue.push({ label: "目前網址", url: currentOrigin });
        }
        return queue;
      }

      function updateLabels() {
        usernamePreview.textContent = String(usernameInput.value || "").trim() || "--";
      }

      function saveLoginState() {
        const data = {
          manualServer: String(manualInput.value || "").trim(),
          username: String(usernameInput.value || "").trim(),
        };
        try {
          window.localStorage.setItem(loginStateKey, JSON.stringify(data));
        } catch (_error) { /* ignore */ }
      }

      function loadLoginState() {
        let saved = {};
        try {
          saved = JSON.parse(window.localStorage.getItem(loginStateKey) || "{}");
        } catch (_error) {
          saved = {};
        }
        const params = new URLSearchParams(window.location.search);
        const queryUsername = String(params.get("username") || "").trim();

        if (!manualInput.value && saved.manualServer) {
          manualInput.value = saved.manualServer;
        }
        if (queryUsername) {
          usernameInput.value = queryUsername;
        } else if (saved.username) {
          usernameInput.value = saved.username;
        }
        updateLabels();
      }

      manualInput.addEventListener("input", saveLoginState);
      usernameInput.addEventListener("input", function () {
        saveLoginState();
        updateLabels();
      });

      // 探測伺服器是否活著：no-cors 模式下，連不上（拒絕/逾時）會 reject；
      // 拿到任何 opaque 回應都代表「伺服器開著」。真正的帳密驗證交給
      // 後續的導頁表單 POST（頂層導航可寫 cookie，不受 SameSite/CORS 限制）。
      function probeServer(url, timeoutMs) {
        return new Promise(function (resolve) {
          let settled = false;
          const timer = setTimeout(function () {
            if (!settled) {
              settled = true;
              resolve(false);
            }
          }, timeoutMs);
          fetch(url + "/api/session", { mode: "no-cors", cache: "no-store" })
            .then(function () {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(true);
              }
            })
            .catch(function () {
              if (!settled) {
                settled = true;
                clearTimeout(timer);
                resolve(false);
              }
            });
        });
      }

      // 用導頁表單把帳密 POST 到目標伺服器的 /api/login
      // （redirect_mode=html：成功 302 到該機 /dashboard，失敗導回登入頁）。
      function submitLoginTo(url, username, password) {
        const formEl = document.createElement("form");
        formEl.method = "POST";
        formEl.action = url + "/api/login";
        formEl.style.display = "none";
        const fields = {
          username: username,
          password: password,
          redirect_mode: "html",
        };
        Object.keys(fields).forEach(function (name) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = fields[name];
          formEl.appendChild(input);
        });
        document.body.appendChild(formEl);
        formEl.submit();
      }

      function setLoginBusy(busyText) {
        submitButton.disabled = !!busyText;
        submitButton.textContent = busyText || "登入手機版看盤";
      }

      function renderRetryList(results) {
        retryListEl.innerHTML = results.map(function (entry) {
          const stateClass = entry.alive ? "retry-ok" : "retry-fail";
          const stateText = entry.alive ? "可連線" : "無回應";
          return (
            `<div class="retry-server-row">` +
              `<span class="retry-server-label">${entry.label}</span>` +
              `<span class="retry-server-state ${stateClass}">${stateText}</span>` +
            `</div>`
          );
        }).join("");
      }

      let lastResults = [];
      let roaming = false;

      async function startRoamingLogin() {
        if (roaming) {
          return;
        }
        const username = String(usernameInput.value || "").trim();
        const password = String(passwordInput.value || "").trim();
        if (!username || !password) {
          errorEl.textContent = "請先輸入帳號與密碼";
          errorEl.hidden = false;
          return;
        }
        errorEl.hidden = true;
        saveLoginState();
        roaming = true;
        setLoginBusy("搜尋伺服器中...");
        try {
          await runRoamingLogin(username, password);
        } finally {
          roaming = false;
          setLoginBusy("");
        }
      }

      async function runRoamingLogin(username, password) {
        const queue = buildServerQueue();
        if (!queue.length) {
          errorEl.textContent = "伺服器列表是空的，請先輸入手動 IP 或到管理頁新增伺服器";
          errorEl.hidden = false;
          return;
        }
        let results = queue.map(function (entry) {
          return { label: entry.label, url: entry.url, alive: false };
        });
        for (let round = 1; round <= LOGIN_ROUNDS; round++) {
          setLoginBusy(`搜尋伺服器中...（第 ${round}/${LOGIN_ROUNDS} 輪）`);
          for (let i = 0; i < queue.length; i++) {
            selectedServerLabel.textContent = `輪巡中：${queue[i].label}`;
            // eslint-disable-next-line no-await-in-loop
            const alive = await probeServer(queue[i].url, 2500);
            results[i].alive = alive;
            if (alive) {
              // 伺服器開著 → 直接把帳密導頁過去登入；成功或密碼錯，
              // 都會在目標伺服器上完成（成功進 dashboard、失敗回登入頁）。
              submitLoginTo(queue[i].url, username, password);
              return;
            }
          }
          if (round < LOGIN_ROUNDS) {
            renderRetryList(results); // 讓說明窗即時顯示目前探測狀況
          }
        }
        // 3 輪全部失敗 → 說明窗（連線 / 取消）
        lastResults = results;
        renderRetryList(lastResults);
        retryModal.hidden = false;
      }

      retryConnectButton.addEventListener("click", async function () {
        const username = String(usernameInput.value || "").trim();
        const password = String(passwordInput.value || "").trim();
        if (!username || !password) {
          retryModal.hidden = true;
          errorEl.textContent = "請先輸入帳號與密碼";
          errorEl.hidden = false;
          return;
        }
        retryConnectButton.disabled = true;
        retryConnectButton.textContent = "連線中...";
        try {
          await runRoamingLogin(username, password);
        } finally {
          retryConnectButton.disabled = false;
          retryConnectButton.textContent = "連線";
        }
      });

      retryCancelButton.addEventListener("click", function () {
        retryModal.hidden = true;
        selectedServerLabel.textContent = "自動輪巡伺服器列表";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        await startRoamingLogin();
      });

      // ---- 新增使用者（需求 2）：彈出視窗，先驗管理者帳密，成功後切換
      // 到新增帳密表單。整個流程都在 modal 內完成，不打斷登入頁輸入。----
      const addUserModal = document.getElementById("add-user-modal");
      const adminGateForm = document.getElementById("admin-gate-form");
      const newUserForm = document.getElementById("new-user-form");
      const addModalTitle = document.getElementById("add-user-title");
      const closeAddModalButton = document.getElementById("close-add-user-modal");
      const backToGateButton = document.getElementById("back-to-gate-button");
      const gateErrorEl = document.getElementById("gate-error");
      const newUserErrorEl = document.getElementById("new-user-error");

      function setAddStatus(text, isError) {
        addStatusEl.textContent = text || "";
        addStatusEl.classList.toggle("error-text", !!isError);
        addStatusEl.hidden = !text;
      }

      function showGateStep() {
        addUserModal.hidden = false;
        adminGateForm.hidden = false;
        newUserForm.hidden = true;
        addModalTitle.textContent = "管理者驗證";
        gateErrorEl.hidden = true;
        adminGateForm.querySelector("input[name='admin_username']").focus();
      }

      function showNewUserStep() {
        adminGateForm.hidden = true;
        newUserForm.hidden = false;
        addModalTitle.textContent = "新增使用者";
        newUserErrorEl.hidden = true;
        newUserForm.querySelector("input[name='new_username']").focus();
      }

      function closeAddUserModal() {
        addUserModal.hidden = true;
        adminGateForm.reset();
        newUserForm.reset();
        gateErrorEl.hidden = true;
        newUserErrorEl.hidden = true;
        adminGateForm.hidden = false;
        newUserForm.hidden = true;
        addModalTitle.textContent = "管理者驗證";
      }

      addUserButton.addEventListener("click", showGateStep);
      closeAddModalButton.addEventListener("click", closeAddUserModal);
      // 點彈窗外的深色背景也關閉。
      addUserModal.addEventListener("click", function (event) {
        if (event.target === addUserModal) {
          closeAddUserModal();
        }
      });
      backToGateButton.addEventListener("click", showGateStep);

      // 第一步：管理者帳密驗證（打 /api/login，確認 role=admin 後才進第二步）。
      adminGateForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        gateErrorEl.hidden = true;
        const formData = new FormData(adminGateForm);
        const submitButton = adminGateForm.querySelector("button[type='submit']");
        submitButton.disabled = true;
        try {
          const loginResponse = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: formData.get("admin_username"),
              password: formData.get("admin_password"),
            }),
          }).catch(function () { return null; });
          const loginData = loginResponse
            ? await loginResponse.json().catch(function () { return {}; })
            : {};
          if (!loginResponse || !loginResponse.ok || !loginData.ok) {
            gateErrorEl.textContent = (loginData && loginData.error) || "管理者帳密驗證失敗";
            gateErrorEl.hidden = false;
            return;
          }
          if (loginData.role !== "admin") {
            gateErrorEl.textContent = "此帳號不是管理者，無法新增使用者";
            gateErrorEl.hidden = false;
            return;
          }
          showNewUserStep();
        } finally {
          submitButton.disabled = false;
        }
      });

      // 第二步：真的呼叫新增 API（此時 session 已是 admin）。
      newUserForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        newUserErrorEl.hidden = true;
        const formData = new FormData(newUserForm);
        const newUsername = String(formData.get("new_username") || "").trim();
        const newPassword = String(formData.get("new_password") || "").trim();
        const confirmPassword = String(formData.get("new_password_confirm") || "").trim();
        if (!newUsername || !newPassword) {
          newUserErrorEl.textContent = "請輸入新使用者的帳號與密碼";
          newUserErrorEl.hidden = false;
          return;
        }
        if (newPassword !== confirmPassword) {
          newUserErrorEl.textContent = "兩次輸入的密碼不一致";
          newUserErrorEl.hidden = false;
          return;
        }
        const submitButton = newUserForm.querySelector("button[type='submit']");
        submitButton.disabled = true;
        try {
          const saveResponse = await fetch("/api/admin/users/save", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: newUsername, password: newPassword, role: "user" }),
          });
          const saveData = await saveResponse.json().catch(function () { return {}; });
          if (!saveResponse.ok || !saveData.ok) {
            newUserErrorEl.textContent = (saveData && saveData.error) || "新增失敗";
            newUserErrorEl.hidden = false;
            return;
          }
          closeAddUserModal();
          setAddStatus(`已新增使用者「${newUsername}」，可用這組帳密登入了`, false);
        } finally {
          submitButton.disabled = false;
        }
      });

      // 跨伺服器表單登入失敗被導回來時，/api/login 會帶 login_error 參數；
      // 這裡把錯誤顯示在登入表單下方（帳號預填，方便直接重試）。
      const initialError = "{{ initial_login_error|e }}";
      const initialUsername = "{{ initial_username|e }}";
      if (initialError) {
        errorEl.textContent = initialError;
        errorEl.hidden = false;
      }
      if (initialUsername && !usernameInput.value) {
        usernameInput.value = initialUsername;
      }

      loadLoginState();
    }());
  </script>
</body>
</html>
