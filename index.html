<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>手機看盤登入（GitHub 版）</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111d;
      --card: #132137;
      --card-soft: #16263d;
      --text: #eef3fb;
      --muted: #95a7c3;
      --accent: #4a9cff;
      --rise: #ff4d4f;
      --fall: #34d058;
      --border: rgba(255, 255, 255, 0.07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #070d15 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Microsoft JhengHei", "Segoe UI", sans-serif;
      padding: 8px 8px 18px;
    }
    a { color: inherit; text-decoration: none; }
    .auth-shell { width: 100%; max-width: 420px; margin: 4vh auto 0; }
    .auth-card {
      background: rgba(19, 33, 55, 0.94);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .auth-card h1 { margin: 2px 0 0; font-size: 0.95rem; line-height: 1.15; }
    .muted { color: var(--muted); }
    .tiny { font-size: 0.7rem; }
    .server-box {
      display: grid;
      gap: 6px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      margin: 14px 0 6px;
    }
    .server-box div { display: flex; justify-content: space-between; gap: 10px; }
    .server-box span { font-size: 0.72rem; color: var(--muted); }
    .server-box strong { font-size: 0.82rem; word-break: break-all; text-align: right; }
    .auth-form { display: grid; gap: 12px; margin-top: 14px; }
    .auth-form label { display: grid; gap: 4px; font-size: 0.78rem; }
    input[type="text"], input[type="password"] {
      min-height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0 10px;
      font: inherit;
      font-size: 0.82rem;
      background: rgba(8, 18, 31, 0.85);
      color: var(--text);
      width: 100%;
    }
    input:focus { outline: none; border-color: rgba(74, 156, 255, 0.6); }
    .primary-btn, .secondary-btn {
      min-height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 0 10px;
      font: inherit;
      font-size: 0.82rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--accent), #3078ff);
      color: #fff;
      font-weight: 700;
      width: 100%;
    }
    .primary-btn:disabled { opacity: 0.55; cursor: default; }
    .secondary-btn { background: rgba(255, 255, 255, 0.04); color: var(--text); }
    .error-text { color: var(--rise); font-size: 0.78rem; margin: 10px 0 0; }
    details.advanced { margin-top: 12px; }
    details.advanced summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      user-select: none;
    }
    details.advanced[open] summary { color: var(--text); }
    details.advanced .advanced-body { margin-top: 10px; display: grid; gap: 4px; font-size: 0.78rem; }
    .hint-line { font-size: 0.7rem; color: var(--muted); margin: 12px 0 0; line-height: 1.5; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 9, 17, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-overlay[hidden] { display: none; }
    .sheet {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
    }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .sheet-head h3 { margin: 0; font-size: 0.9rem; }
    .retry-server-list { display: grid; gap: 6px; margin: 12px 0; }
    .retry-server-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      font-size: 0.76rem;
    }
    .retry-server-label { word-break: break-all; }
    .retry-server-state { flex-shrink: 0; }
    .retry-ok { color: var(--fall); }
    .retry-fail { color: var(--rise); }
    .gate-actions { display: grid; gap: 8px; margin-top: 12px; }
  </style>
</head>
<body data-page="login">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="eyebrow"></div>
      <h1>手機版即時走勢</h1>

      <div class="server-box">
        <div><span>連線目標</span><strong id="selected-server-label">自動輪巡伺服器列表</strong></div>
        <div><span>帳號</span><strong id="login-username-preview">--</strong></div>
      </div>

      <form id="login-form" class="auth-form">
        <label>
          <span>帳號</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
          <span>密碼</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button id="login-submit-button" type="submit" class="primary-btn">登入手機版看盤</button>
      </form>

      <p id="login-error" class="error-text" hidden></p>

      <details class="advanced">
        <summary>進階：手動指定伺服器 ▾</summary>
        <div class="advanced-body">
          <label>
            <span>手動 IP（優先，可不填）</span>
            <input
              id="manual-server-input"
              type="text"
              name="manual_server"
              inputmode="url"
              placeholder="例：192.168.1.100:5000"
              autocomplete="off"
            >
          </label>
          <p class="tiny muted">填了手動 IP 會最優先嘗試；沒填就照下方內建伺服器列表依序輪巡。</p>
        </div>
      </details>

          </section>
  </main>

  <div id="server-retry-modal" class="modal-overlay" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h3>伺服器尚未開啟</h3>
      </div>
      <div id="retry-server-list" class="retry-server-list"></div>
      <p id="retry-note" class="tiny muted">
        已自動輪巡伺服器列表 3 次都連不上。請確認電腦端程式已開啟，再按「連線」重新嘗試。
      </p>
      <div class="gate-actions">
        <button id="retry-connect-button" type="button" class="primary-btn">連線</button>
        <button id="retry-cancel-button" type="button" class="secondary-btn">取消</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // 憑證是簽給 Tailscale 的 MagicDNS 主機名稱，不能再用 IP，
      // 請把下面換成 `tailscale status` 查到的實際名稱。
      const DEFAULT_SERVERS = [
        { label: "伺服器1", url: "https://REPLACE-WITH-SERVER1-HOSTNAME.ts.net:5000" },
        { label: "伺服器2", url: "https://REPLACE-WITH-SERVER2-HOSTNAME.ts.net:5000" },
        { label: "伺服器3", url: "https://REPLACE-WITH-SERVER3-HOSTNAME.ts.net:5000" }
      ];
      const LOGIN_ROUNDS = 3;
      const PROBE_TIMEOUT_MS = 2500;
      const loginStateKey = "rtd-mobile-login-state";

      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");
      const manualInput = document.getElementById("manual-server-input");
      const usernameInput = form.querySelector("input[name='username']");
      const passwordInput = form.querySelector("input[name='password']");
      const selectedServerLabel = document.getElementById("selected-server-label");
      const usernamePreview = document.getElementById("login-username-preview");
      const submitButton = document.getElementById("login-submit-button");

      const retryModal = document.getElementById("server-retry-modal");
      const retryListEl = document.getElementById("retry-server-list");
      const retryNoteEl = document.getElementById("retry-note");
      const retryConnectButton = document.getElementById("retry-connect-button");
      const retryCancelButton = document.getElementById("retry-cancel-button");

      let lastResults = [];
      let roaming = false;

      function normalizeBaseUrl(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        // 手動輸入沒帶協定時預設補 https，跟登入頁本身（HTTPS）同協定，
        // 避免又跑出混合內容警告。如果對方伺服器仍是純 HTTP，手動輸入時
        // 請自行打上 http:// 開頭。
        const withScheme = /^https?:\/\//i.test(raw) ? raw : ("https://" + raw);
        try {
          return new URL(withScheme).origin.replace(/\/$/, "");
        } catch (_error) {
          return "";
        }
      }

      // 輪巡順序：手動 IP（有填才優先）→ 內建伺服器列表 → ?server= 附加。
      // 注意：label 一律只放「伺服器名稱」，不可以把網址/IP 拼進去——
      // 輪巡時的「輪巡中：xxx」狀態列、以及全部連不上時的說明窗清單，
      // 都會原樣顯示這個 label，拼了網址等於把手機畫面上直接曝露 IP。
      function buildServerQueue() {
        const queue = [];
        const manual = normalizeBaseUrl(manualInput.value);
        if (manual) {
          queue.push({ label: "手動伺服器", url: manual });
        }
        DEFAULT_SERVERS.forEach(function (item) {
          const url = normalizeBaseUrl(item && item.url);
          if (!url || queue.some(function (e) { return e.url === url; })) return;
          queue.push({ label: String((item && item.label) || "伺服器"), url: url });
        });
        const params = new URLSearchParams(window.location.search);
        let extraCount = 0;
        (params.getAll("server") || []).forEach(function (extra) {
          const url = normalizeBaseUrl(extra);
          if (url && !queue.some(function (e) { return e.url === url; })) {
            extraCount += 1;
            queue.push({ label: "附加伺服器 " + extraCount, url: url });
          }
        });
        return queue;
      }

      function updateLabels() {
        usernamePreview.textContent = String(usernameInput.value || "").trim() || "--";
      }

      function saveLoginState() {
        try {
          window.localStorage.setItem(loginStateKey, JSON.stringify({
            manualServer: String(manualInput.value || "").trim(),
            username: String(usernameInput.value || "").trim()
          }));
        } catch (_error) { /* ignore */ }
      }

      function loadLoginState() {
        let saved = {};
        try {
          saved = JSON.parse(window.localStorage.getItem(loginStateKey) || "{}");
        } catch (_error) { saved = {}; }
        const params = new URLSearchParams(window.location.search);
        const queryUsername = String(params.get("username") || "").trim();
        const queryError = String(params.get("login_error") || "").trim();
        if (!manualInput.value && saved.manualServer) manualInput.value = saved.manualServer;
        if (queryUsername) usernameInput.value = queryUsername;
        else if (saved.username) usernameInput.value = saved.username;
        if (queryError) {
          errorEl.textContent = queryError;
          errorEl.hidden = false;
        }
        updateLabels();
      }

      function probeByFetch(url, timeoutMs) {
        return new Promise(function (resolve) {
          let settled = false;
          const finish = function (ok) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve(ok);
          };
          const timer = setTimeout(function () { finish(false); }, timeoutMs);
          fetch(url + "/api/session", { mode: "no-cors", cache: "no-store" })
            .then(function () { finish(true); })
            .catch(function () { finish(false); });
        });
      }

      function probeByScriptTag(url, timeoutMs) {
        return new Promise(function (resolve) {
          const scriptEl = document.createElement("script");
          let settled = false;
          const finish = function (ok) {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            if (scriptEl.parentNode) scriptEl.parentNode.removeChild(scriptEl);
            resolve(ok);
          };
          const timer = setTimeout(function () { finish(false); }, timeoutMs);
          scriptEl.onload = function () { finish(true); };
          scriptEl.onerror = function () { finish(false); };
          scriptEl.src = url + "/api/session?probe=" + Date.now();
          document.head.appendChild(scriptEl);
        });
      }

      async function probeServer(url, timeoutMs) {
        if (await probeByFetch(url, timeoutMs)) return true;
        return probeByScriptTag(url, Math.max(timeoutMs, 3000));
      }

      function submitLoginTo(url, username, password) {
        const formEl = document.createElement("form");
        formEl.method = "POST";
        formEl.action = url + "/api/login";
        formEl.style.display = "none";
        const fields = { username: username, password: password, redirect_mode: "html" };
        Object.keys(fields).forEach(function (name) {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = fields[name];
          formEl.appendChild(input);
        });
        document.body.appendChild(formEl);
        formEl.submit();
      }

      function setLoginBusy(busyText) {
        submitButton.disabled = !!busyText;
        submitButton.textContent = busyText || "登入手機版看盤";
      }

      function renderRetryList(results, withDirectButtons) {
        retryListEl.innerHTML = results.map(function (entry, index) {
          const stateClass = entry.alive ? "retry-ok" : "retry-fail";
          const stateText = entry.alive ? "可連線" : "無回應";
          const directBtn = withDirectButtons
            ? '<button type="button" data-direct-index="' + index + '" class="direct-login-btn">直接登入</button>'
            : "";
          return (
            '<div class="retry-server-row">' +
              '<span class="retry-server-label">' + entry.label + "</span>" +
              '<span style="display:flex;gap:8px;align-items:center;flex-shrink:0;">' +
                '<span class="retry-server-state ' + stateClass + '">' + stateText + "</span>" +
                directBtn +
              "</span>" +
            "</div>"
          );
        }).join("");
        retryListEl.querySelectorAll(".direct-login-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const entry = lastResults[Number(btn.getAttribute("data-direct-index"))];
            const username = String(usernameInput.value || "").trim();
            const password = String(passwordInput.value || "").trim();
            if (!entry || !username || !password) return;
            submitLoginTo(entry.url, username, password);
          });
        });
      }

      async function runRoamingLogin(username, password) {
        const queue = buildServerQueue();
        if (!queue.length) {
          errorEl.textContent = "伺服器列表是空的，請先輸入手動 IP";
          errorEl.hidden = false;
          return;
        }
        const results = queue.map(function (entry) {
          return { label: entry.label, url: entry.url, alive: false };
        });
        for (let round = 1; round <= LOGIN_ROUNDS; round++) {
          setLoginBusy("搜尋伺服器中...（第 " + round + "/" + LOGIN_ROUNDS + " 輪）");
          for (let i = 0; i < queue.length; i++) {
            selectedServerLabel.textContent = "輪巡中：" + queue[i].label;
            const alive = await probeServer(queue[i].url, PROBE_TIMEOUT_MS);
            results[i].alive = alive;
            if (alive) {
              submitLoginTo(queue[i].url, username, password);
              return;
            }
          }
          if (round < LOGIN_ROUNDS) renderRetryList(results, true);
        }
        lastResults = results;
        renderRetryList(lastResults, true);
        retryModal.hidden = false;
      }

      async function startRoamingLogin() {
        if (roaming) return;
        const username = String(usernameInput.value || "").trim();
        const password = String(passwordInput.value || "").trim();
        if (!username || !password) {
          errorEl.textContent = "請先輸入帳號與密碼";
          errorEl.hidden = false;
          return;
        }
        errorEl.hidden = true;
        saveLoginState();
        roaming = true;
        setLoginBusy("搜尋伺服器中...");
        try {
          await runRoamingLogin(username, password);
        } finally {
          roaming = false;
          setLoginBusy("");
          selectedServerLabel.textContent = "自動輪巡伺服器列表";
        }
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        startRoamingLogin();
      });

      retryConnectButton.addEventListener("click", async function () {
        const username = String(usernameInput.value || "").trim();
        const password = String(passwordInput.value || "").trim();
        if (!username || !password) {
          retryModal.hidden = true;
          errorEl.textContent = "請先輸入帳號與密碼";
          errorEl.hidden = false;
          return;
        }
        retryConnectButton.disabled = true;
        retryConnectButton.textContent = "連線中...";
        try {
          await runRoamingLogin(username, password);
        } finally {
          retryConnectButton.disabled = false;
          retryConnectButton.textContent = "連線";
        }
      });

      retryCancelButton.addEventListener("click", function () {
        retryModal.hidden = true;
        selectedServerLabel.textContent = "自動輪巡伺服器列表";
      });

      manualInput.addEventListener("input", saveLoginState);
      usernameInput.addEventListener("input", function () {
        saveLoginState();
        updateLabels();
      });

      loadLoginState();
    }());
  </script>
</body>
</html>
